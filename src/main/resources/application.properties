spring.application.name=easy-reserve-api
server.address=0.0.0.0
server.port=${EASY_RESERVE_PORT:9011}

spring.messages.encoding=UTF-8

logging.level.org.hibernate=ERROR
logging.file.name=logs/app.log
logging.level.root=INFO

logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=15
logging.logback.rollingpolicy.total-size-cap=1GB

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=ERROR

#DB
spring.datasource.url=${EASY_RESERVE_DB_URL:jdbc:postgresql://localhost:5450/easy_reserve_db}
spring.datasource.username=${EASY_RESERVE_DB_USERNAME:adm}
spring.datasource.password=${EASY_RESERVE_DB_PASSWORD:Teste1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

security.jwt.secret=${JWT_SECRET:easy-reserve-default-secret-key-must-be-at-least-32-bytes-long}
security.jwt.expiration=86400000
server.forward-headers-strategy=framework

# Version & Build Metadata
app.name=easy-reserve-api
app.version=${APP_VERSION:0.1.0}
app.build-number=${BUILD_NUMBER:local}
app.git-commit=${GIT_COMMIT:dev}
app.build-time=${BUILD_TIME:}
app.environment=${APP_ENV:production}
