      <text x="9" y="0" class="tag-fk-text">FK</text>
      <text x="24" y="0" class="col-name">environment_id</text>
      <text x="292" y="0" class="col-type">UUID <tspan class="col-req">*</tspan></text>
      <line x1="-14" y1="10" x2="306" y2="10" class="row-divider" />
    </g>
    <g transform="translate(14, 118)">
