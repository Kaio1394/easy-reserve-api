  <!-- Legend -->
  <g transform="translate(60, 860)">
    <g transform="translate(0, 0)">
      <rect x="0" y="-10" width="20" height="14" class="tag-pk-bg" />
      <text x="10" y="1" class="tag-pk-text">PK</text>
      <text x="26" y="2" class="leg-text">Primary Key</text>
    </g>
    <g transform="translate(140, 0)">
      <rect x="0" y="-10" width="20" height="14" class="tag-fk-bg" />
      <text x="10" y="1" class="tag-fk-text">FK</text>
      <text x="26" y="2" class="leg-text">Foreign Key</text>
    </g>
    <g transform="translate(280, 0)">
      <rect x="0" y="-10" width="20" height="14" class="tag-uq-bg" />
      <text x="10" y="1" class="tag-uq-text">UQ</text>
      <text x="26" y="2" class="leg-text">Unique Constraint</text>
    </g>
    <g transform="translate(440, 0)">
      <text x="0" y="2" style="fill: #ef4444; font-weight: bold; font-size: 14px;">*</text>
      <text x="12" y="2" class="leg-text">NOT NULL</text>
